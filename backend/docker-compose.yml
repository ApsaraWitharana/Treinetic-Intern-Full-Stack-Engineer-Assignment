version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ijse@2001
      MYSQL_DATABASE: task_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5

  task-service:
    build: ./task-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/task_manager?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ijse@2001
      SERVER_PORT: 8082
      SERVER_SERVLET_CONTEXT_PATH: /task-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

  user-service:
    build: ./user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/task_manager?useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ijse@2001
      SERVER_PORT: 8083
      SERVER_SERVLET_CONTEXT_PATH: /user-service
      SPRING_JWT_SECRET: e#s$p%o$r^t9
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:



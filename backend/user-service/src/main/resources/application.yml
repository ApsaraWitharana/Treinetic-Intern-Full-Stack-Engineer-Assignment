server:
  port: 8083
  servlet:
    context-path: /user-service

spring:
  application:
    name: user-service

  # Database configurations
  datasource:
    url: jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ijse@2001
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
    generate-ddl: true
    database: mysql

  # Error handling
  server:
    error:
      include-message: always

  # Multipart file upload configurations
  servlet:
    multipart:
      enabled: true

  # JWT Token secret
  jwt:
    secret: e#s$p%o$r^t9
